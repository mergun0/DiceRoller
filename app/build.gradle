plugins {
    alias(libs.plugins.android.application)
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file("keystore/release-signing.properties")
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def releaseStoreFile = releaseSigningProperties.getProperty("storeFile") ?: System.getenv("DICEROLLER_STORE_FILE")
def releaseStorePassword = releaseSigningProperties.getProperty("storePassword") ?: System.getenv("DICEROLLER_STORE_PASSWORD")
def releaseKeyAlias = releaseSigningProperties.getProperty("keyAlias") ?: System.getenv("DICEROLLER_KEY_ALIAS")
def releaseKeyPassword = releaseSigningProperties.getProperty("keyPassword") ?: System.getenv("DICEROLLER_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.merg.diceroller'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.merg.diceroller"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.core.splashscreen
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
